openapi: 3.0.3
info:
  title: Builder API
  version: 1.0.0
  description: API documentation for Builder project
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new user account with a username and password.
      summary: Register user
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns the API health status and database connectivity.
      summary: Health check
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/sites/:
    get:
      operationId: sites_retrieve
      description: Return all sites available to authenticated users.
      summary: List sites
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sites_create
      description: Create a new site for the authenticated user.
      summary: Create site
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/sites/{id}/:
    get:
      operationId: sites_retrieve_2
      description: Retrieve a single site by its ID.
      summary: Get site
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: sites_update
      description: Update an existing site completely.
      summary: Update site
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: sites_partial_update
      description: Partially update an existing site.
      summary: Patch site
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: sites_destroy
      description: Delete a site by its ID.
      summary: Delete site
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/sites/{id}/lock/:
    get:
      operationId: sites_lock_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sites_lock_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: sites_lock_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: sites_lock_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/sites/{site_pk}/pages/:
    get:
      operationId: sites_pages_retrieve
      description: Return all pages belonging to a specific site.
      summary: List pages
      parameters:
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sites_pages_create
      description: Create a new page under a specific site.
      summary: Create page
      parameters:
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/sites/{site_pk}/pages/{id}/:
    get:
      operationId: sites_pages_retrieve_2
      description: Retrieve a single page by its ID.
      summary: Get page
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: sites_pages_update
      description: Update an existing page completely.
      summary: Update page
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: sites_pages_partial_update
      description: Partially update an existing page.
      summary: Patch page
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: sites_pages_destroy
      description: Delete a page by its ID.
      summary: Delete page
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
