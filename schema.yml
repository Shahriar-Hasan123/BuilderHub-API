openapi: 3.0.3
info:
  title: Builder API
  version: 1.0.0
  description: API documentation for Builder project
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/sites/:
    get:
      operationId: sites_retrieve
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sites_create
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/sites/{id}/:
    get:
      operationId: sites_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: sites_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: sites_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: sites_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/sites/{site_pk}/pages/:
    get:
      operationId: sites_pages_retrieve
      parameters:
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: sites_pages_create
      parameters:
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/sites/{site_pk}/pages/{id}/:
    get:
      operationId: sites_pages_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: sites_pages_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: sites_pages_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: sites_pages_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: site_pk
        schema:
          type: integer
        required: true
      tags:
      - sites
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
